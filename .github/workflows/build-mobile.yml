name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle & Sync Capacitor
        run: node build-mobile.js

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pleniora-pos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  build-ios:
    name: Build iOS Project (Offline)
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle & Sync Capacitor
        run: node build-mobile.js

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS' -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath build clean build

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pleniora-pos-ios-build
          path: ios/App/build/
          if-no-files-found: ignore
