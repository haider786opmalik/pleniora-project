<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Account and plan | Pleniora</title><link rel="stylesheet" href="css/market.css"></head><body class="auth-body"><main class="auth-wrap"><div class="auth-top"><a class="m-brand" href="/"><span>P</span> Pleniora</a></div><section class="auth-card"><h1>Account & subscription</h1><p id="accountStatus">Loading account…</p><h3>Continue with a plan</h3><p>Prices are in Pakistani Rupees (PKR). Selecting a plan records your choice; payment checkout is not live yet.</p><div class="guide-call"><button class="m-btn" onclick="choose('monthly')">PKR Rs 2,000 / month</button><button class="m-btn secondary" onclick="choose('yearly')">PKR Rs 20,000 / year</button></div><div id="accountFeedback" aria-live="polite"></div><p class="auth-foot"><a href="app.html">Back to business manager</a> · <a href="starter-guide.html">Starter guide</a></p></section></main><script>
async function init(){let r=await fetch('/api/me');if(!r.ok){location.href='/login.html';return}let {user}=await r.json();document.getElementById('accountStatus').textContent=user.trialDaysRemaining?`${user.businessName} · ${user.trialDaysRemaining} trial day(s) remaining.`:`${user.businessName} · Trial ended. Select a plan to continue.`}
async function choose(plan){let f=document.getElementById('accountFeedback');try{let r=await fetch('/api/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({plan})}),x=await r.json();f.className='auth-note';f.textContent=`${x.message} Plan selected: ${x.currency||'PKR'} ${Number(x.amount||0).toLocaleString()} / ${plan==='monthly'?'month':'year'}.`;if(!r.ok)f.className='auth-error'}catch{f.className='auth-error';f.textContent='Could not reach the server.'}}
init();</script></body></html>
