<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Platform Admin | Pleniora</title><link rel="stylesheet" href="css/market.css"><style>
.pa{max-width:1250px;margin:0 auto;padding:26px}.pa-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.pa-head h1{font-size:30px;margin:8px 0}.pa-tools{display:flex;gap:9px;flex-wrap:wrap}.pa-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.pa-stat,.pa-panel{border:1px solid #e9e5dc;background:white;border-radius:12px;padding:17px}.pa-stat small{color:#697381}.pa-stat strong{display:block;font-size:24px}.pa-panel{padding:0;overflow:hidden}.pa-panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid #e9e5dc}.pa-search{max-width:260px;padding:9px;border:1px solid #ddd9d0;border-radius:8px}.pa table{width:100%;border-collapse:collapse;min-width:800px}.pa th,.pa td{padding:11px 12px;text-align:left;border-bottom:1px solid #eee;font-size:13px}.pa th{font-size:11px;color:#697381;background:#fcfbf8}.pa-scroll{overflow:auto}.pa-row-actions{display:flex;align-items:center;gap:6px}.pa-delete{color:#a8322b!important;border-color:#efd1ce!important}.pa-delete:hover:not(:disabled){background:#fff0ee!important}.pa-delete:disabled{opacity:.55}.pill{border-radius:15px;background:#f4f1e9;padding:4px 8px;font-size:11px}.pill.ok{background:#e9f7ee;color:#16714d}.pill.off{background:#fff0ee;color:#aa322a}.pa-dialog{border:0;border-radius:14px;width:min(760px,94vw);max-height:90vh;padding:0;box-shadow:0 25px 70px #0004}.pa-dialog::backdrop{background:#0007}.pa-form{padding:20px;overflow:auto;max-height:90vh}.pa-form h2{margin:0 0 10px}.pa-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.pa-form label{display:block;font-size:12px;font-weight:650;margin:9px 0 4px}.pa-form input,.pa-form select{width:100%;padding:9px;border:1px solid #ddd9d0;border-radius:7px}.pa-modules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;margin:10px 0}.pa-modules label{display:flex;align-items:center;gap:6px;font-weight:400}.pa-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.pa-msg{padding:11px;margin-top:12px;border-radius:8px;background:#fff4dc;color:#745419}.pa-msg.err{background:#fff0ee;color:#a32f26}@media(max-width:700px){.pa{padding:17px}.pa-stats{grid-template-columns:1fr 1fr}.pa-head{align-items:flex-start;flex-direction:column}.pa-form-grid{grid-template-columns:1fr}.pa-modules{grid-template-columns:1fr 1fr}}
</style></head><body><main class="pa"><header class="pa-head"><div><a class="m-brand" href="/"><span>RF</span> Rida Platform Admin</a><h1>Business accounts</h1><p>Manage shop logins, allowed modules and complimentary access.</p></div><div class="pa-tools"><button class="m-btn" onclick="openCreate()">+ Create business account</button><button class="m-btn secondary" onclick="logoutPlatform()">Log out</button></div></header><div class="pa-stats"><div class="pa-stat"><small>Total accounts</small><strong id="statTotal">0</strong></div><div class="pa-stat"><small>Trial / free access</small><strong id="statFree">0</strong></div><div class="pa-stat"><small>Paid active</small><strong id="statPaid">0</strong></div><div class="pa-stat"><small>Suspended</small><strong id="statSuspended">0</strong></div></div><section class="pa-panel"><div class="pa-panel-head"><b>Customer businesses</b><input id="search" class="pa-search" placeholder="Search shop, owner or email" oninput="renderTenants()"></div><div class="pa-scroll"><table><thead><tr><th>Shop / Owner</th><th>Login email</th><th>Plan / Access</th><th>Access ends</th><th>Modules</th><th>Status</th><th>Manage</th></tr></thead><tbody id="tenantRows"><tr><td colspan="7">Loading accounts…</td></tr></tbody></table></div></section><div id="message" aria-live="polite"></div></main>
<dialog class="pa-dialog" id="tenantDialog"><form class="pa-form" id="tenantForm"><h2 id="formTitle">Create business login</h2><input type="hidden" name="id"><div class="pa-form-grid"><div><label>Owner name</label><input name="name" required minlength="2"></div><div><label>Shop / business name</label><input name="businessName" required minlength="2"></div><div><label>Business type</label><select name="businessType"><option>General Retail</option><option>Clothing &amp; Fabrics</option><option>Restaurant &amp; Cafe</option><option>Pharmacy</option><option>Grocery &amp; Supermarket</option><option>Electronics</option><option>Salon &amp; Services</option><option>Bakery &amp; Food</option><option>Wholesale &amp; Distribution</option><option>Hardware &amp; Building</option><option>Automotive &amp; Parts</option></select></div><div><label>Login email</label><input name="email" type="email" required></div><div><label id="passLabel">Temporary password (10+ chars)</label><input name="password" type="password" minlength="10" placeholder="Required for new account"></div><div><label>Access type</label><select name="freeAccessMode" id="freeAccessMode"><option value="none">30-day trial only / require subscription</option><option value="until">Free until a date</option><option value="lifetime">Lifetime free</option></select></div><div><label>Free access end date (for one month, choose one month from today)</label><input name="freeAccessUntil" type="date"></div><div><label>Extra trial days (0–30)</label><input name="trialDays" type="number" min="0" max="30" value="30"></div><div><label>Account status</label><select name="status"><option value="active">Active</option><option value="suspended">Suspended</option></select></div></div><label>Tools / modules this account can access</label><div id="moduleChecks" class="pa-modules"></div><div class="pa-actions"><button class="m-btn secondary" type="button" onclick="closeDialog()">Cancel</button><button class="m-btn" id="saveButton">Create login</button></div><div id="formMessage" aria-live="polite"></div></form></dialog><script src="js/platform-admin.js"></script></body></html>
